name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Cancel in-progress runs for the same ref to avoid wasting CI minutes on
# stale pushes (e.g. force-push mid-review).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to full commit SHAs (supply-chain hardening):
# a moved or compromised version tag cannot inject code into this workflow.
jobs:
  # ── Unit tests ─────────────────────────────────────────────────────────────
  # Fast, hermetic — no docker required.  Runs on every push and PR.
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          # tests/infrastructure/test_docker_compose.py runs `docker compose
          # config`, which requires the .env referenced by env_file: to exist.
          cp .env.example .env
          # Install the fully-pinned lockfile, then the shared package editable
          # WITHOUT deps (the lock already pins shared's runtime closure, so
          # --no-deps keeps the locked versions authoritative — no re-resolution).
          pip install -r requirements-dev.txt
          pip install -e shared/ --no-deps

      - name: Lint (ruff)
        run: ruff check .

      - name: Run unit tests
        run: python -m pytest tests/ -m "not integration" -q

  # ── Lockfile drift ─────────────────────────────────────────────────────────
  # Enforces ADR-0012: the committed lockfiles must match what the floors
  # (*.in + shared/pyproject.toml) compile to. Catches the "floor changed but
  # lock not regenerated" mistake — a declared-but-not-installed dependency.
  # pip-compile keeps existing pins unless --upgrade is passed, so a routine
  # upstream release does NOT make this job fail; only an out-of-date lock does.
  lockfiles:
    name: Lockfile Drift Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install C deps for python-ldap metadata
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libldap2-dev libsasl2-dev

      - name: Install pip-tools
        run: pip install pip-tools==7.5.3

      - name: Recompile lockfiles
        run: |
          pip-compile --strip-extras --output-file=requirements-dev.txt requirements-dev.in shared/pyproject.toml -q
          pip-compile --strip-extras --output-file=services/event-ingestion/requirements.txt services/event-ingestion/requirements.in shared/pyproject.toml -q
          pip-compile --strip-extras --output-file=services/identity-normalization/requirements.txt services/identity-normalization/requirements.in shared/pyproject.toml -q
          pip-compile --strip-extras --output-file=demo/requirements.txt demo/requirements.in -q

      - name: Fail if lockfiles are out of date
        run: |
          if ! git diff --exit-code -- requirements-dev.txt 'services/*/requirements.txt' demo/requirements.txt; then
            echo "::error::Lockfiles are out of date. Run the pip-compile commands in DEPENDENCIES.md and commit the result."
            exit 1
          fi

  # ── Integration tests ──────────────────────────────────────────────────────
  # Requires the live docker compose stack.  Only runs after unit tests pass.
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          cp .env.example .env
          # The dev lockfile is a superset of demo/requirements.txt (the demo
          # harness deps are pinned in requirements-dev.in too), so it covers the
          # integration harness on its own. Shared installed editable, no deps.
          pip install -r requirements-dev.txt
          pip install -e shared/ --no-deps

      - name: Run integration tests
        run: python -m pytest tests/integration --integration -v

      # The harness runs the stack under the dedicated compose project
      # "naas-it" (see tests/integration/conftest.py) — logs and teardown
      # must target that project.
      - name: Dump docker compose logs on failure
        if: failure()
        run: docker compose -p naas-it -f docker-compose.yml -f docker-compose.test.yml logs --no-color

      - name: Upload test logs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: integration-test-logs
          path: tests/integration/.logs/
          if-no-files-found: ignore

      - name: Tear down docker stack
        if: always()
        run: docker compose -p naas-it -f docker-compose.yml -f docker-compose.test.yml down -v --remove-orphans || true

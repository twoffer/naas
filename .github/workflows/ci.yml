name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Cancel in-progress runs for the same ref to avoid wasting CI minutes on
# stale pushes (e.g. force-push mid-review).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to full commit SHAs (supply-chain hardening):
# a moved or compromised version tag cannot inject code into this workflow.
jobs:
  # ── Unit tests ─────────────────────────────────────────────────────────────
  # Fast, hermetic — no docker required.  Runs on every push and PR.
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          # tests/infrastructure/test_docker_compose.py runs `docker compose
          # config`, which requires the .env referenced by env_file: to exist.
          cp .env.example .env
          pip install -r requirements-dev.txt -e shared/

      - name: Lint (ruff)
        run: ruff check .

      - name: Run unit tests
        run: python -m pytest tests/ -m "not integration" -q

  # ── Integration tests ──────────────────────────────────────────────────────
  # Requires the live docker compose stack.  Only runs after unit tests pass.
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            demo/requirements.txt

      - name: Install dependencies
        run: |
          cp .env.example .env
          pip install -r requirements-dev.txt -r demo/requirements.txt -e shared/

      - name: Run integration tests
        run: python -m pytest tests/integration --integration -v

      # The harness runs the stack under the dedicated compose project
      # "naas-it" (see tests/integration/conftest.py) — logs and teardown
      # must target that project.
      - name: Dump docker compose logs on failure
        if: failure()
        run: docker compose -p naas-it -f docker-compose.yml -f docker-compose.test.yml logs --no-color

      - name: Upload test logs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: integration-test-logs
          path: tests/integration/.logs/
          if-no-files-found: ignore

      - name: Tear down docker stack
        if: always()
        run: docker compose -p naas-it -f docker-compose.yml -f docker-compose.test.yml down -v --remove-orphans || true

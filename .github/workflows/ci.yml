name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Cancel in-progress runs for the same ref to avoid wasting CI minutes on
# stale pushes (e.g. force-push mid-review).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Unit tests ─────────────────────────────────────────────────────────────
  # Fast, hermetic — no docker required.  Runs on every push and PR.
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          # tests/infrastructure/test_docker_compose.py runs `docker compose
          # config`, which requires the .env referenced by env_file: to exist.
          cp .env.example .env
          pip install -r requirements-dev.txt -e shared/
          pip install -r services/event-ingestion/requirements.txt
          # identity-normalization: exclude python-ldap (needs gcc + libldap2-dev).
          # The service lazy-imports `ldap` so the test suite stays importable
          # without it — mirrors the project's dev-venv convention exactly.
          grep -vE '^python-ldap' services/identity-normalization/requirements.txt > /tmp/idnorm-req.txt
          pip install -r /tmp/idnorm-req.txt

      - name: Run unit tests
        run: python -m pytest tests/ -m "not integration" -q

  # ── Integration tests ──────────────────────────────────────────────────────
  # Requires the live docker compose stack.  Only runs after unit tests pass.
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            demo/requirements.txt

      - name: Install dependencies
        run: |
          cp .env.example .env
          pip install -r requirements-dev.txt -r demo/requirements.txt -e shared/

      - name: Run integration tests
        run: python -m pytest tests/integration --integration -v

      - name: Dump docker compose logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Upload test logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-logs
          path: tests/integration/.logs/
          if-no-files-found: ignore

      - name: Tear down docker stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml down -v --remove-orphans || true

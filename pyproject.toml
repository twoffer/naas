[tool.pytest.ini_options]
asyncio_mode = "auto"
# Explicit default (pytest-asyncio 0.25 warns when unset): each async fixture
# gets a function-scoped event loop, matching how each async test runs.
asyncio_default_fixture_loop_scope = "function"
timeout = 60
timeout_method = "thread"
addopts = "--import-mode=importlib"
consider_namespace_packages = true
markers = [
    "integration: live-docker integration test (skip by default; opt in via --integration flag or NAAS_RUN_INTEGRATION=1 env var)",
]

[tool.ruff.lint.per-file-ignores]
# Service test files inject sys.path (via per-service conftest pattern) before
# importing app.* — module-level imports cannot all sit at the top of the file.
"tests/**" = ["E402"]

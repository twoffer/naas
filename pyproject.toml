[tool.pytest.ini_options]
asyncio_mode = "auto"
# Explicit default (pytest-asyncio 0.25 warns when unset): each async fixture
# gets a function-scoped event loop, matching how each async test runs.
asyncio_default_fixture_loop_scope = "function"
timeout = 60
timeout_method = "thread"
addopts = "--import-mode=importlib"
consider_namespace_packages = true
markers = [
    "integration: live-docker integration test (skip by default; opt in via --integration flag or NAAS_RUN_INTEGRATION=1 env var)",
]
# Turn every warning into a test failure so future deprecations surface loudly,
# with one deliberate carve-out: Starlette's TestClient warns that its `httpx`
# backend is deprecated in favor of `httpx2`, which has no stable release yet —
# nothing to migrate to, so this one known third-party warning stays ignored.
filterwarnings = [
    "error",
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]

# Coverage scope for pytest-cov (the CI unit-test step passes --cov): all
# shipped code — the shared library plus both implemented services' app/ trees.
# Measured and reported, not gated: a --cov-fail-under threshold is deliberately
# omitted (the number is the signal, not a ratchet).
[tool.coverage.run]
source = [
    "shared/naas_shared",
    "services/event-ingestion/app",
    "services/identity-normalization/app",
]

# Type-checking gate over all shipped code: shared/naas_shared plus both
# implemented services' app/ trees (enforced by the mypy step in
# .github/workflows/ci.yml). Both services expose a top-level package named
# `app`, so one mypy invocation cannot cover them both (duplicate module name);
# the gate runs as two commands, each including shared/naas_shared so
# cross-package use of the shared models/schemas is type-checked too:
#   mypy shared/naas_shared services/event-ingestion/app
#   mypy shared/naas_shared services/identity-normalization/app
[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
# Ratchet flags: everything shipped is fully annotated today; these keep it so
# and flag ignore-comments/casts that become stale as dependencies update.
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

# python-ldap is an untyped C extension, deliberately absent from the dev venv
# (containers-only; the adapter lazy-imports it — see CLAUDE.md). Resolve its
# modules to Any instead of erroring on the missing package.
[[tool.mypy.overrides]]
module = ["ldap", "ldap.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
# ruff 0.16 formats Python code blocks inside Markdown by default. Our Markdown
# snippets are illustrative excerpts (spec docs, agent-memory notes), often
# deliberately compacted — keep the formatter/linter to real Python sources.
extend-exclude = ["*.md"]
# Shared by the formatter and the linter's E501. Pinned explicitly so an upstream
# default change can't silently reflow the codebase. (E501 itself is not yet in the
# lint `select` — see docs/FOLLOWUPS.md.)
line-length = 88

[tool.ruff.lint]
# Enterprise rule-set ratchet (see the `select` groups below). The lint standard
# is enforced by the `ruff check .` step in .github/workflows/ci.yml.
#
# Deliberately NOT enabled (would fight this codebase or are separate efforts):
#   RUF001/002/003  ambiguous-unicode  — CLAUDE.md mandates preserving emoji,
#                                        box-drawing, and arrow glyphs verbatim.
#   PLC0415         import-outside-top-level — lazy imports here are deliberate
#                                        (e.g. optional `ldap`, see CLAUDE.md).
#   ANN*, D*, E501, PLR2004, COM812    — large/opinionated; future ratchets.
select = [
    "E4", "E7", "E9", "F",  # ruff defaults: pyflakes (F) + a subset of pycodestyle (E)
    "I",                    # isort — import ordering
    "UP",                   # pyupgrade — modern py312 syntax
    "C4",                   # flake8-comprehensions
    "PIE",                  # flake8-pie — misc lints
    "PERF",                 # perflint — performance anti-patterns
    "SIM",                  # flake8-simplify
    "RET",                  # flake8-return
    "RUF",                  # ruff-specific (unicode subset RUF001-003 ignored below)
    "ASYNC",                # flake8-async — blocking calls in async code
    "DTZ",                  # flake8-datetimez — tz-aware datetimes (audit safety)
    "G",                    # flake8-logging-format
    "LOG",                  # flake8-logging
    "ISC",                  # flake8-implicit-str-concat
    "FLY",                  # flynt — static str-join → f-string
    "B",                    # flake8-bugbear — likely bugs
    "BLE",                  # flake8-blind-except — no bare `except Exception`
    "S",                    # flake8-bandit — security (IAM platform)
    "N",                    # pep8-naming
]

# Rules selected by family above but deliberately suppressed, with rationale.
ignore = [
    # Combining nested context managers into one `with a, b:` forces large body
    # dedents across the test mock-stacks (patch-deps wrapping a TestClient) for
    # marginal benefit; the layered nesting reads as intentional setup/teardown.
    "SIM117",  # multiple-with-statements
    # Ambiguous-unicode rules flag the emoji / box-drawing / arrow glyphs that
    # CLAUDE.md mandates preserving verbatim in docstrings, comments, and strings.
    "RUF001",  # ambiguous-unicode-character-string
    "RUF002",  # ambiguous-unicode-character-docstring
    "RUF003",  # ambiguous-unicode-character-comment
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection markers are designed to be called in argument
# defaults (`param: T = Depends(...)`); they are effectively immutable sentinels,
# so B008 (function-call-in-default-argument) is a false positive for them.
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Cookie",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
    "fastapi.Security",
]

[tool.ruff.lint.per-file-ignores]
# Test code legitimately exercises patterns bandit flags in production: bare
# asserts ARE the assertion mechanism; the subprocess/urllib calls drive the
# test harness against the local compose stack with hardcoded args; and the
# "credentials" are throwaway fixtures, never real secrets.
"tests/**" = [
    # Naming rules relaxed where test identifiers must mirror external names:
    #   N802 — test names embed protocol attribute identifiers verbatim
    #          (e.g. test_departmentNumber_maps_to_department, test_E_maps_to_FTE).
    #   N801/N818 — fake exception classes mirror python-ldap's real class names
    #          (ldap.SERVER_DOWN, ldap.TIMEOUT, ...) so they are drop-in doubles.
    "N801",  # invalid-class-name
    "N802",  # invalid-function-name
    "N818",  # error-suffix-on-exception-name
    # `except Exception: pytest.fail(...)` (and startup-error capture) is a
    # standard test assertion idiom — assert that NO exception type escapes and
    # report the offender. Enforced in shipped code (services/, demo/), not here.
    "BLE001",  # blind-except
    "S101",  # assert — the pytest assertion mechanism
    "S104",  # hardcoded-bind-all-interfaces — "0.0.0.0" appears in test data/assertions
    "S105",  # hardcoded-password-string — fixture/expected values, not real secrets
    "S106",  # hardcoded-password-func-arg — fixture credentials
    "S310",  # suspicious-url-open — urllib against fixed localhost test endpoints
    "S603",  # subprocess-without-shell — controlled test-harness invocations
    "S607",  # start-process-with-partial-path — e.g. `docker`/`python` on PATH in harness
]

# Enterprise format standard, enforced by the `ruff format --check .` step in
# .github/workflows/ci.yml. Black-compatible; line-ending pinned for determinism.
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
# Pinned to LF (vs. the "auto" default) so the gate is deterministic across platforms
# and guards against future CRLF creep; zero diff today (the repo is all-LF).
line-ending = "lf"
# Respect the "magic trailing comma": a trailing comma in a collection/call/signature
# keeps it expanded one-per-line, leaving authors manual control over vertical layout.
skip-magic-trailing-comma = false
# docstring-code-format intentionally left off (default false): the repo's docstrings
# carry box-drawing / arrow glyphs that CLAUDE.md mandates preserving verbatim.


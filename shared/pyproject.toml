[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "naas-shared"
version = "2.0.0"
description = "Shared library for NAAS microservices"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.10.0",
    # Security floor: GHSA-4xgf-cpjx-pc3j (NestedSecretsSettingsSource symlink
    # escape, fixed in 2.14.2). Do not lower below 2.14.2.
    "pydantic-settings>=2.14.2",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "redis>=5.0.0",
    "structlog>=23.2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["naas_shared*"]

# PEP 561: ship the py.typed marker so installed consumers (the service
# containers) get naas_shared's inline type annotations, not Any.
[tool.setuptools.package-data]
naas_shared = ["py.typed"]
